<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulaire de contact</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>
        <!-- Consigne 1 : en-tête du formulaire -->
        <h2>Contactez-nous</h2>
        <p> Service d'aide , développement Front-End entièrement personalisé et paufiné par Lilou Walkowiak</p>

        <!-- Consigne 6 : fieldset et legend -->
        <fieldset>
        <legend> Vos coordonées</legend>

        <!-- Consigne 2 : champs Nom et E-mail avec label et required -->
        <section> 
        <label for="nom">Nom </label>
            <input required>
        </section>

        <section>
        <label for="email">E-mail</label>
            <input type="email">
        </section>

        <section> 
            <label>Code postal</label>
            <input minlength="5" pattern="[A-B0-9]{6}" title="6 Caractère Max">
        </section>
        </fieldset>

        <!-- Consigne 3 : select avec 3 options -->
        <label for="aide">Aide</label> 
        <input type="text" id="aide" name="aide" list="Aide">

        <datalist id="Aide">
            <option value="Question Générale">
            <option value="Problème technique">
            <option value="Autres">
        </datalist>
        

        <!-- Consigne 9 (optionnel) : remplacer le select par un input + datalist -->

        <!-- Consigne 4 : textarea avec required -->
        <label> Commentaire </label>
            <textarea rows="4"></textarea>

        <!-- Consigne 7 : champ Code postal avec pattern -->
        
        <!-- Consigne 5 : bouton d'envoi -->
        <button type="submit">Envoyer</button> 
    </main>
</body>
</html>
